name: release

# The release lane: the artifacts, the content pack, and the SIGNED feed.
#
# The feed is the one file the app fetches, so it is the one file that has
# to come from a trusted machine. It is signed here with a secret
# (`AIPASS_RELEASE_KEY`); the public half is in the app's source
# (`aipass-bridge/harness/update-keys.mjs`) and lands in the app's next
# build. A release without a signed feed is not a release the app can update
# from — and a feed signed by a key the app does not know is refused, which
# is the point of the whole arrangement.
#
# The key must be in the keyring BEFORE the feed that names it is published.
# The keyring ships with the app, so the order is: land the key in the
# source, build an app that trusts it, and only then publish the feed.
#
# The feed's `sequence` is the rollback guard (`AGENTS.md` rule 15): the
# app refuses a feed older than the one it has seen. The release lane must
# therefore sign a sequence that only goes up. `github.run_number` is a
# per-workflow counter that increases on every run of this workflow, so a
# tag push cannot sign sequence 1 twice. A manual `workflow_dispatch` may
# override it, but the override has to be higher than the last release —
# the app is the thing that enforces it, this file only supplies the number.
#
# The publish job waits for tests as well as the build: a tag push does not
# run `test.yml` (it triggers on branches and pull requests), so without the
# `test` job below a tag could publish a feed from a tree the suite has
# never run on.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sequence:
        description: 'optional feed sequence override (must only go up; defaults to github.run_number)'
        required: false
      notes:
        description: 'optional feed notes for this release (defaults to the head commit message)'
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The suite is the reusable test.yml workflow, not a copy of its steps: a
  # copy drifts from the real lane the day someone edits one and not the
  # other. `uses` needs workflow_call in test.yml (added there) — without
  # it the call is refused and the release lane has no gate at all.
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: build ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows x64
            artifact: aipass-desktop-windows
          - os: macos-latest
            label: macos
            artifact: aipass-desktop-macos
          - os: ubuntu-latest
            label: linux x64
            artifact: aipass-desktop-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm ci
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.artifact }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Build the artifact
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the feed
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm ci

      - name: Collect every platform's artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: aipass-desktop-*
          path: dist

      # Each platform writes its own manifest.json and SHA256SUMS; downloading
      # them into one folder would overwrite all but one. Flatten them first so
      # the feed and the release upload see every platform.
      - name: Merge the per-platform manifests
        run: node scripts/merge-release-manifests.mjs

      # The content pack is the same tree on every platform — it is the code,
      # not the binary — so it is built once, here.
      - name: Build the content pack
        run: npm run desktop:content-pack

      # The signing key is a secret and never in the repository. The public
      # half is in the source; this is the private one.
      # The sequence comes from github.run_number on a tag push so every
      # feed the app sees is newer than the last. The notes come from the
      # head commit: on a tag push github.event.release.body is always
      # empty (there is no release yet), which is why the feed used to
      # carry empty notes.
      - name: Sign the feed
        env:
          AIPASS_RELEASE_KEY: ${{ secrets.AIPASS_RELEASE_KEY }}
          AIPASS_RELEASE_KEY_ID: ${{ secrets.AIPASS_RELEASE_KEY_ID || 'aipass-release-2026' }}
          AIPASS_RELEASE_SEQUENCE: "${{ github.event.inputs.sequence || github.run_number }}"
          AIPASS_RELEASE_NOTES: "${{ github.event.inputs.notes || github.event.head_commit.message || '' }}"
        run: npm run desktop:feed

      # The feed is signed, and the app verifies it — so the public key in the
      # source has to be the one that signed this. `npm run desktop:feed`
      # checks that with the app's own verifier and refuses to write a feed
      # the app would turn down, so a mismatch stops the release here rather
      # than at the first person whose app fetches the feed.
      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          generate_release_notes: true
