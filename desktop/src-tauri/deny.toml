# cargo-deny policy for the Tauri shell — the Rust supply chain, not npm.
#
# Zero npm runtime dependencies did not mean zero dependencies: the shell
# compiles ~440 crates from `Cargo.lock`. This file is what keeps that tree
# audited — RustSec advisories and license drift fail `cargo deny check`
# in CI (`.github/workflows/test.yml`, the shell job: install + check).
# `npm run check` does not run it locally on purpose: the advisory DB
# needs network, and `scripts/test-rust.mjs` already runs `cargo test`
# for the local lane.
#
# `cargo deny check` reads this file from the crate root; there is no
# versioning of the tool in this config, and the check does not compare
# against a baseline — a new advisory or a new crate shows up red on the
# run that introduces it, which is the point.
#
# Format note: the advisories severity keys (`vulnerability`, `unmaintained`,
# `unsound`, `notice`) were removed in cargo-deny 0.20 (PR #611). The
# template defaults apply — vulnerability denies, the rest warn — so the
# section is kept as a stub rather than re-inventing the old keys.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "x86_64-apple-darwin"]

[advisories]
# lint levels are the template defaults (deny on vulnerability).
# The four unmaintained transitive crates below are upstream (tauri and its
# single-instance plugin); they are ignored with a reason, not silently —
# a new advisory on one of OUR direct crates still fails the check.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: transitive via syn 1.x through the Tauri tree; upstream fix pending" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: via tauri-plugin-single-instance -> zbus; upstream fix pending" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: via tauri-plugin-single-instance -> zbus; upstream fix pending" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via tauri-plugin-single-instance -> zbus; upstream fix pending" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Apache-2.0 WITH LLVM-exception",
]
exceptions = []
confidence-threshold = 0.8

[bans]
highlight = "all"
multiple-versions = "warn"
wildcards = "allow"
# wildcard-wildcard duplicates none pinned; skip only when a crate really needs it
